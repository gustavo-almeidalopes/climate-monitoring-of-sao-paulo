# ClimaSP — gateway (padrão strangler). Um endereço só para o painel e a API:
#   /api/v1/ops/report/context  -> Python (contexto de clima do relatório, usado pelo Java)
#   /api/v1/ops/*, /api/v1/geo/* -> Java (equipes, ocorrências, rotas, PostGIS)
#   /api/v1/ops-java/*           -> Java (OpenAPI e Swagger do serviço Java)
#   todo o resto                 -> Python (clima, previsão, ML, notícias e o painel estático)
# Para voltar a operação ao Python, basta remover os blocos do Java.
upstream python_api { server api:8000; }
upstream java_ops   { server ops:8081; }

server {
    listen 8080;
    client_max_body_size 1m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /api/v1/ops/report/context { proxy_pass http://python_api; }
    location /api/v1/ops/                 { proxy_pass http://java_ops; }
    location /api/v1/geo/                 { proxy_pass http://java_ops; }
    location /api/v1/ops-java/            { proxy_pass http://java_ops; }

    location / { proxy_pass http://python_api; }
}
